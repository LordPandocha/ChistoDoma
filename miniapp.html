<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071d52">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Чисто Дома — заявка</title>
<style>
:root{
  --blue:#1456d6;--cyan:#2ec4ff;--deep:#071d52;--sky:#e8f1ff;
  --ice:#f3f8ff;--ink:#10213f;--mut:#667793;
  --tg-bg:var(--tg-theme-bg-color,#f3f8ff);
  --tg-secondary:var(--tg-theme-secondary-bg-color,#fff);
  --tg-text:var(--tg-theme-text-color,#10213f);
  --tg-hint:var(--tg-theme-hint-color,#667793);
  --tg-button:var(--tg-theme-button-color,#1456d6);
  --tg-button-text:var(--tg-theme-button-text-color,#fff);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--tg-bg);color:var(--tg-text);font-family:Inter,Manrope,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh;padding:
  calc(12px + var(--tg-safe-area-inset-top,0px))
  12px
  calc(22px + var(--tg-safe-area-inset-bottom,0px));
}
.app{max-width:680px;margin:0 auto}
.site-link{display:inline-flex;align-items:center;gap:7px;margin:0 0 10px;color:var(--tg-link-color,#1456d6);font-size:13px;font-weight:900;text-decoration:none;padding:8px 2px}
.hero{
  position:relative;overflow:hidden;margin-bottom:14px;padding:22px 20px;border-radius:26px;
  color:#fff;background:
  radial-gradient(130px 100px at 92% 0%,rgba(46,196,255,.42),transparent 70%),
  linear-gradient(155deg,#071d52,#1456d6);
  box-shadow:0 16px 38px rgba(20,86,214,.2);
}
.hero:after{content:"";position:absolute;width:130px;height:130px;border:1px solid rgba(255,255,255,.18);border-radius:50%;right:-35px;bottom:-60px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-weight:900}
.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.15);font-size:22px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
h1{font-size:28px;line-height:1.08;margin:0 0 8px;font-weight:900;letter-spacing:-.02em}
.lead{margin:0;color:#d9e8ff;font-size:14px;line-height:1.45}
.card{
  background:var(--tg-secondary);border:1px solid rgba(20,86,214,.1);border-radius:24px;
  padding:20px;box-shadow:0 10px 30px rgba(20,86,214,.08);
}
h2{font-size:21px;line-height:1.15;margin:0 0 5px}
.mini{margin:0 0 18px;color:var(--tg-hint);font-size:13px}
.form{display:grid;gap:14px}
.field{display:grid;gap:7px}
label.title{font-weight:800;font-size:13px}
input,select,textarea{
  width:100%;border:1px solid rgba(20,86,214,.16);background:var(--tg-bg);color:var(--tg-text);
  border-radius:15px;padding:13px 14px;font:inherit;outline:none;
}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(46,196,255,.12)}
.file{
  display:block;border:2px dashed rgba(20,86,214,.25);border-radius:18px;padding:16px;
  background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(232,241,255,.28));cursor:pointer;
}
.file input{display:none}
.file strong{display:block;margin-bottom:3px}
.file span{display:block;color:var(--tg-hint);font-size:12px}
.preview{display:none;align-items:center;gap:10px;margin-top:10px;padding:9px;border-radius:14px;background:var(--ice);font-size:12px;font-weight:800}
.preview.on{display:flex}
.preview img{width:52px;height:52px;border-radius:12px;object-fit:cover}
.bottom{display:grid;gap:12px;margin-top:2px}
.consent{display:flex;gap:9px;align-items:flex-start;color:var(--tg-hint);font-size:12px;line-height:1.35}
.consent input{width:17px;height:17px;padding:0;margin:1px 0 0;flex:0 0 auto;accent-color:var(--blue)}
button{
  width:100%;border:0;border-radius:16px;padding:15px;background:var(--tg-button);color:var(--tg-button-text);
  font:inherit;font-weight:900;font-size:16px;cursor:pointer;box-shadow:0 10px 24px rgba(20,86,214,.22);
}
button:disabled{opacity:.6;cursor:wait}
.status{display:none;border-radius:14px;padding:12px 13px;font-size:13px;font-weight:800}
.status.show{display:block}
.status.ok{background:rgba(46,196,255,.12)}
.status.err{background:rgba(255,80,80,.12)}
.footer{text-align:center;color:var(--tg-hint);font-size:11px;padding:13px 0 0}
</style>
</head>
<body>
<div class="app">
  <a class="site-link" href="./#zayavka">← Вернуться на сайт</a>
  <section class="hero">
    <div class="brand"><div class="logo">🧼</div><div>Чисто Дома</div></div>
    <h1>Заявка по фото</h1>
    <p class="lead">Фото + телефон + короткий комментарий — и мы сориентируем вас по чистке.</p>
  </section>

  <section class="card">
    <h2>Расскажите, что нужно почистить</h2>
    <p class="mini">Можно заполнить за минуту.</p>

    <form class="form" id="leadForm" enctype="multipart/form-data">
      <div class="field">
        <label class="title" for="phone">📱 Номер телефона</label>
        <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+7 900 000-00-00" required>
      </div>

      <div class="field">
        <label class="title" for="item">🛋 Что нужно почистить?</label>
        <select id="item" name="item">
          <option>Стул</option>
          <option>Кресло</option>
          <option>Диван</option>
          <option>Угловой диван</option>
          <option>Матрас</option>
          <option>Другое</option>
        </select>
      </div>

      <div class="field">
        <label class="title" for="comment">💬 Комментарий</label>
        <textarea id="comment" name="comment" placeholder="Например: пятна от еды, нужен экспресс-сушка"></textarea>
      </div>

      <div class="field">
        <label class="title">📸 Фото мебели</label>
        <label class="file" for="photo">
          <input id="photo" name="photo" type="file" accept="image/*" required>
          <strong>Нажмите и выберите фото</strong>
          <span>Одно изображение до 10 МБ</span>
          <span class="preview" id="preview">
            <img id="previewImg" alt="Предпросмотр">
            <span id="fileName"></span>
          </span>
        </label>
      </div>

      <div class="bottom">
        <label class="consent">
          <input id="consent" type="checkbox" required>
          <span>Согласен на обработку указанных данных для связи по заявке.</span>
        </label>
        <button id="submit" type="submit">📸 Отправить заявку</button>
        <div id="status" class="status" role="status" aria-live="polite"></div>
      </div>
    </form>
  </section>
  <div class="footer">Нефтеюганск · +7 912 088-30-29</div>
</div>

<script>
(function(){
  const form = document.getElementById('leadForm');
  const photo = document.getElementById('photo');
  const preview = document.getElementById('preview');
  const previewImg = document.getElementById('previewImg');
  const fileName = document.getElementById('fileName');
  const status = document.getElementById('status');
  const submit = document.getElementById('submit');
  const phone = document.getElementById('phone');

  function show(msg,type) {
    status.textContent = msg;
    status.className = 'status show ' + type;
  }

  photo.addEventListener('change', function(){
    const f = photo.files && photo.files[0];
    if (!f) { preview.classList.remove('on'); return; }
    if (f.size > 10 * 1024 * 1024) {
      show('Фото больше 10 МБ. Выберите файл поменьше.', 'err');
      photo.value = '';
      preview.classList.remove('on');
      return;
    }
    fileName.textContent = f.name;
    previewImg.src = URL.createObjectURL(f);
    preview.classList.add('on');
  });

  phone.addEventListener('input', function(){
    const digits = phone.value.replace(/\D/g,'').replace(/^8/,'7').slice(0,11);
    let out = '+7';
    if (digits.length > 1) out += ' ' + digits.slice(1,4);
    if (digits.length >= 5) out += ' ' + digits.slice(4,7);
    if (digits.length >= 8) out += '-' + digits.slice(7,9);
    if (digits.length >= 10) out += '-' + digits.slice(9,11);
    phone.value = out;
  });

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    const f = photo.files && photo.files[0];
    if (!f) return show('Добавьте фото мебели.', 'err');

    const data = new FormData(form);
    data.set('site','Чисто Дома');
    data.set('city','Нефтеюганск');

    submit.disabled = true;
    submit.textContent = 'Отправляем…';

    try {
      const res = await fetch('/api/lead', {
        method:'POST',
        body:data,
        headers:{'Accept':'application/json'}
      });
      const payload = await res.json().catch(function(){return {};});
      if (!res.ok) throw new Error(payload.error || 'Ошибка отправки');

      form.reset();
      preview.classList.remove('on');
      show('✅ Заявка отправлена! Мы свяжемся с вами по указанному номеру.', 'ok');
    } catch (err) {
      show('⚠️ ' + (err.message || 'Не удалось отправить заявку.'), 'err');
    } finally { 
      submit.disabled = false;
      submit.textContent = '📸 Отправить заявку';
    }
  });
})();
</script>
</body>
</html>
